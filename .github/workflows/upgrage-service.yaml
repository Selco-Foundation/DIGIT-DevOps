name: Update Service Image Tag

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Name of the service"
        required: true
        type: choice
        options:
          - sikkim
      service_tag:
        description: "New image tag (e.g. v2.3.7, dev-abcd123)"
        required: true
        type: string
  repository_dispatch:
    types: [update-image-tag]
  push:
    branches:
      - helm-upgrade-gha-poc

run-name: Update ${{ github.event.inputs.service_name || github.event.client_payload.service_name }} to ${{ github.event.inputs.service_tag || github.event.client_payload.service_tag }}

# Allow only one job at a time to prevent race conditions.
concurrency:
  group: gitops-image-updates
  cancel-in-progress: false

jobs:
  update-tag:
    runs-on: ubuntu-latest
    environment: dev
    env:
      SERVICE_NAME: ${{ github.event.inputs.service_name || github.event.client_payload.service_name || 'sikkim' }}
      SERVICE_TAG: ${{ github.event.inputs.service_tag || github.event.client_payload.service_tag || 'uat-jkchre43' }}
      ENVIRONMENT: selco-dev

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Inputs
        run: |
          if [ -z "${{ env.SERVICE_NAME }}" ] || [ -z "${{ env.SERVICE_TAG }}" ] || [ -z "${{ env.ENVIRONMENT }}" ]; then
            echo "Error: Missing required inputs. Service Name, Tag, and Environment must be provided."
            exit 1
          fi

          # Sanitize tag input to prevent basic path traversal or command injections in yq
          if [[ ! "${{ env.SERVICE_TAG }}" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "Error: Invalid characters in service_tag."
            exit 1
          fi

      - name: Check if service exists in file and Update Image Tag.
        run: |
          IMAGE_TAGS_FILEPATH="./deploy-as-code/charts/environments/${{ env.ENVIRONMENT }}-tags.yaml"

          if [ "$(yq eval ".${{ env.SERVICE_NAME }}" "$IMAGE_TAGS_FILEPATH")" = "null" ]; then
            echo "Error: '${{ env.SERVICE_NAME }}' does not exist in $IMAGE_TAGS_FILEPATH."
            exit 1
          fi

          yq eval -i '.${{ env.SERVICE_NAME }}.image.tag="${{ env.SERVICE_TAG }}"' "$IMAGE_TAGS_FILEPATH"

          # Update DB Migration image if present
          if [ "$(yq eval ".${{ env.SERVICE_NAME }}.initContainers.dbMigration" "$IMAGE_TAGS_FILEPATH")" != "null" ]; then
            yq eval -i '.${{ env.SERVICE_NAME }}.initContainers.dbMigration.image.tag="${{ env.SERVICE_TAG }}"' "$IMAGE_TAGS_FILEPATH"
          fi

      # - name: Commit and Push Changes
      #   run: |
      #     git config --global user.name "github-actions[bot]"
      #     git config --global user.email "github-actions[bot]@users.noreply.github.com"

      #     git add "./deploy-as-code/charts/environments/${{ env.ENVIRONMENT }}-tags.yaml"

      #     # Check if tag is unchanged
      #     if git diff-index --quiet HEAD; then
      #       echo "No changes found. Tag might already be set to $SERVICE_TAG"
      #       exit 0
      #     fi

      #     git commit -m "Update image tag for ${{ env.SERVICE_NAME }} to ${{ env.SERVICE_TAG }} in ${{ env.ENVIRONMENT }}"

      #     git pull --rebase
      #     git push


        # Update in cluster
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654556600:role/GitHubActionsRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ vars.CLUSTER_NAME_DEV }}

      - name: Install sops
        run: |
          sudo apt update
          wget https://github.com/mozilla/sops/releases/download/v3.7.1/sops-v3.7.1.linux
          chmod +x sops-v3.7.1.linux
          sudo mv sops-v3.7.1.linux /usr/local/bin/sops

      - name: sops decryption
        working-directory: ./deploy-as-code/charts/environments
        run: sops -d -i ./${{ env.ENVIRONMENT }}-secrets.yaml

      - name: View template
        working-directory: ./deploy-as-code/charts
        run: |
          CHART_PATH='./core-services/${{ env.SERVICE_NAME }}'
          kubectl auth can-i create deploy
          helm list -n core-dev

          helm dependency build $CHART_PATH
          helm template $CHART_PATH \
            -f ./environments/${{ env.ENVIRONMENT }}.yaml \
            -f ./environments/${{ env.ENVIRONMENT }}-tags.yaml \
            -f ./environments/${{ env.ENVIRONMENT }}-secrets.yaml

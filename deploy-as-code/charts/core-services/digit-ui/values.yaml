# Common Labels
labels:
  app: "digit-ui"
  group: "web"

# Ingress Configs
ingress:
  enabled: true
  context: "digit-ui"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "selcohub/micro-ui"
  tag: develop-68b314469fbd4096a3898f2d4ec38a1bcd5faf78
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/digit-ui/"
  readinessProbePath: "/digit-ui/"
    
extraVolumes: |
  - name: js-injection
    configMap:
      name: digit-ui

extraVolumeMounts: |
  - mountPath: /etc/nginx/conf.d/sub_filter.conf
    name: js-injection
    subPath: sub_filter.conf

env: |
  - name: REACT_APP_PROXY_ASSETS
    valueFrom:
      configMapKeyRef:
        key: egov-services-fqdn-name
        name: egov-config

# Common Labels
labels:
  app: "egov-indexer"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "egov-indexer"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "egov_indexer_schema"
    image:
      repository: "egovio/egov-indexer-db"
      tag: v2.9.2-4a60f20
  gitSync:
    enabled: true
    repo: "git@github.com:egovernments/configs"
    branch: "master"
    env: |
      - name: "GIT_SYNC_REPO"
        value: "{{ .Values.initContainers.gitSync.repo }}"
      - name: "GIT_SYNC_BRANCH"
        value: "{{ .Values.initContainers.gitSync.branch }}"
      {{- if .Values.initContainers.gitSync.rev }}
      - name: "GIT_SYNC_REV"
        value: "{{ .Values.initContainers.gitSync.rev }}"
      {{- end }}
      - name: "GIT_SYNC_DEPTH"
        value: "0"            
      - name: "GIT_SYNC_ONE_TIME"
        value: "true"          
      - name: "GIT_SYNC_SSH"
        value: "true"      
      - name: "GIT_SYNC_ROOT"
        value: "/work-dir"
  extraInitContainers: |
    - name: wait-for-kafka
      image: busybox:latest
      command:
        - /bin/sh
        - -c
        - "echo \"Waiting for Kafka to be ready...\"\nuntil nc -z kafka-kraft.backbone-dev.svc.cluster.local 9092; do\n  echo \"Kafka is not available yet...\"\n  sleep 5 \ndone\necho \"kafka is up!\" \n"
      imagePullPolicy: Always

# Container Configs
image:
  repository: "egovio/egov-indexer"
  tag: master-1e8d2bb
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/egov-indexer/health"
  readinessProbePath: "/egov-indexer/health"
appType: "java-spring"
otel: "true"
tracing-enabled: true
egov-indexer-yaml-repo-path: "file:///work-dir/configs/egov-indexer/billingservices-indexer.yml,file:///work-dir/configs/egov-indexer/collection-indexer.yml,file:///work-dir/configs/egov-indexer/egov-telemetry-indexer.yml,file:///work-dir/configs/egov-indexer/egov-uploader-indexer.yml,file:///work-dir/configs/egov-indexer/error-queue.yml,file:///work-dir/configs/egov-indexer/finance-rolloutadotpion-indexer.yml,file:///work-dir/configs/egov-indexer/payment-indexer.yml,file:///work-dir/configs/egov-indexer/rainmaker-pgr-indexer.yml,file:///work-dir/configs/egov-indexer/rainmaker-pt-indexer.yml,file:///work-dir/configs/egov-indexer/tradelicense-indexer.yml,file:///work-dir/configs/egov-indexer/rainmaker-tl-indexer.yml"
heap: "-Xmx192m -Xms192m"
indexer-host: "egov-indexer"
memory_requests: "768Mi"
memory_limits: "1024Mi"

# Additional Container Envs
env: |
  - name: EGOV_SERVICES_INFRA_INDEXER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: {{ index .Values "indexer-host" }}
  - name: EGOV_INFRA_INDEXER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: es-indexer-host
  - name: EGOV_INDEXER_YML_REPO_PATH
    value: {{ index .Values "egov-indexer-yaml-repo-path" | quote }}
  {{- if index .Values "global" "serializers-timezone-in-ist" }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.egov.tracer.kafka.serializer.ISTTimeZoneJsonSerializer
  {{- end }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_STATELEVEL_TENANTID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-state-level-tenant-id
  - name: EGOV_INDEXER_ES_USERNAME
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: username
  - name: EGOV_INDEXER_ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: password   
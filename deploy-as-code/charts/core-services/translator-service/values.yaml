name: translator-service
namespace: core-dev

# Common Labels
labels:
  app: "translator-service"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "translator-service"

# Container Configs
image:
  repository: "selcohub/translator-service"
  tag: develop-54442a0b6a27d0661ffa8ae2ce70706c46446615
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/translator-service/health"
  readinessProbePath: "/translator-service/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"

persistence:
  enabled: false

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: /translator-service
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: translator-service
        key: GEMINI_API_KEY

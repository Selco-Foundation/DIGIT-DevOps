# Common Labels
labels:
  app: "bulk-indexer"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "bulk-indexer"

# Container Configs
image:
  repository: selcohub/bulk-indexer
  tag: staging-33c33e52c0a612a681069799c9f279290e5a13b4
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/bulk-indexer/health"
  readinessProbePath: "/bulk-indexer/health"
appType: "java-spring"
otel: "true"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"

# Elasticsearch serves https with a certificate issued by its own cluster CA, which the JVM
# default trust store doesn't know. Mount that CA (same secret Kibana already trusts) and point
# egov.bulkindexer.es.ca-certificate.path at it, or _bulk calls fail with PKIX path building failed.
extraVolumes: |
  - name: es-ca-cert
    secret:
      secretName: elasticsearch-master-certs
      items:
        - key: ca.crt
          path: ca.crt

extraVolumeMounts: |
  - name: es-ca-cert
    mountPath: "/etc/es-certs"
    readOnly: true

# Additional Container Envs
env: |
  {{- if index .Values "global" "serializers-timezone-in-ist" }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.egov.tracer.kafka.serializer.ISTTimeZoneJsonSerializer
  {{- end }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_STATELEVEL_TENANTID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-state-level-tenant-id
  - name: EGOV_BULKINDEXER_ES_HOST_NAME
    value: https://elasticsearch-data.backbone-dev
  - name: EGOV_BULKINDEXER_ES_PORT_NO
    value: "9200"
  - name: EGOV_BULKINDEXER_ES_USERNAME
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: username
  - name: EGOV_BULKINDEXER_ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: password
  - name: EGOV_BULKINDEXER_ES_CA_CERTIFICATE_PATH
    value: "/etc/es-certs/ca.crt"
  - name: KAFKA_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers

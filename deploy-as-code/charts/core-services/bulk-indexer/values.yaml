# Common Labels
labels:
  app: "bulk-indexer"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "bulk-indexer"

# Container Configs
image:
  repository: selcohub/bulk-indexer
  tag: bulk-save-develop-tmp-57a924ab5ca2bdfe945bc9abcf87beba47d11277
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/bulk-indexer/health"
  readinessProbePath: "/bulk-indexer/health"
appType: "java-spring"
otel: "true"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"

# Additional Container Envs
env: |
  {{- if index .Values "global" "serializers-timezone-in-ist" }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.egov.tracer.kafka.serializer.ISTTimeZoneJsonSerializer
  {{- end }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_STATELEVEL_TENANTID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-state-level-tenant-id
  - name: EGOV_INDEXER_ES_USERNAME
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: username
  - name: EGOV_INDEXER_ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: password
  - name: EGOV_BULKINDEXER_ES_HOST_NAME
    value: https://elasticsearch-data.backbone-dev
  - name: EGOV_BULKINDEXER_ES_PORT_NO
    value: "9200"
  - name: EGOV_BULKINDEXER_ES_USERNAME
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: username
  - name: EGOV_BULKINDEXER_ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: password

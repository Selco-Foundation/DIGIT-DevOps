# Common Labels
labels:
  app: "boundary-service"
  group: "core"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "boundary_service_schema"
    image:
      repository: "egovio/boundary-service-db"
      tag: core-2.9-lts-mvn-check-05ac8acd37-32

# Ingress Configs
ingress:
  zuul: true
  context: "boundary-service"

# Container Configs
image:
  repository: "egovio/boundary-service"
  tag: core-2.9-lts-mvn-check-05ac8acd37-32
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/boundary-service/health"
  readinessProbePath: "/boundary-service/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"

persistence:
  enabled: false

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: /boundary-service
  - name: SERVER_CONTEXT_PATH
    value: /boundary-service
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: EGOV_LOCALIZATION_SEARCH_ENDPOINT
    value: /localization/messages/v1/_search
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-idgen
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: EGOV_HRMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-hrms
  - name: WORKFLOW_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-workflow-v2



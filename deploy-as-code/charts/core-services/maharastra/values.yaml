# Common Labels
labels:
  app: "maharasatra"
  group: "web"

# Ingress Configs
ingress:
  enabled: true
  context: "maharasatra"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "selcohub/maharasatra-ui"
  tag: multi-tenant-image-test-208afca1b9bfcd76e6be3891abfb0a522d43e34a
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/maharasatra/"
  readinessProbePath: "/maharasatra/"

env: |
  - name: PUBLIC_PATH
    value: /maharasatra

    
extraVolumes: |
  - name: js-injection
    configMap:
      name: maharasatra

extraVolumeMounts: |
  - mountPath: /etc/nginx/conf.d/sub_filter.conf
    name: js-injection
    subPath: sub_filter.conf

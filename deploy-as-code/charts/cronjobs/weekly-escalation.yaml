apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-escalation
  namespace: core-dev
spec:
  schedule: "0 9 * * 1"
  timeZone: Asia/Kolkata
  successfulJobsHistoryLimit: 1
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: weekly-escalation
            image: selcohub/weekly-escalation:latest-14112025
          restartPolicy: OnFailure

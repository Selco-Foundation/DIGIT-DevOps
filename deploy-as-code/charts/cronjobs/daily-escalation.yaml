apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-escalation
  namespace: core-dev
spec:
  schedule: "0 18 * * 1-6"
  timeZone: Asia/Kolkata
  successfulJobsHistoryLimit: 1
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: daily-escalation
            image: selcohub/daily-escalation:latest-14112025
          restartPolicy: OnFailure

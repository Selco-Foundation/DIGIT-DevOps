global:
  extraEnvFrom:
    - secretRef:
        name: loki-aws
  extraArgs:
    - "-config.expand-env=true"


# extraArgs:
#   - -config.expand-env=true

loki:
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      region: ap-south-1
      bucketnames: 'loki-uat-selco'
      s3forcepathstyle: false
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 672h # 28 days retention

  storage:
    type: s3
    bucketNames:
      chunks: 'loki-uat-selco'
#      ruler: <Your AWS bucket for ruler, for example, `aws-loki-dev-ruler`>
#      admin: <Your AWS bucket for admin, for example, `aws-loki-dev-admin`>
    s3:
      # AWS endpoint URL
      endpoint: s3.ap-south-1.amazonaws.com
      # AWS region where the S3 bucket is located
      region: ap-south-1
      # AWS secret access key
      secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
      # AWS access key ID
      accessKeyId: "${AWS_ACCESS_KEY_ID}"
      # Forces the path style for S3 (true/false)
      s3ForcePathStyle: false
      # Allows insecure (HTTP) connections (true/false)
      insecure: false
      # HTTP configuration settings
      http_config: {}

# Disable minio storage
minio:
  enabled: false

deploymentMode: SingleBinary

singleBinary:
  replicas: 2
  persistence:
    storageClass: gp2
    accessModes:
      - ReadWriteOnce
    size: 10Gi

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
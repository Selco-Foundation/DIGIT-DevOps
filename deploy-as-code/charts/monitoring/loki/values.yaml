loki:
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      region: ap-south-1
      bucketnames: 'loki-uat-selco'
      s3forcepathstyle: false
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 720h # 30 days (1 month) retention
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_cancel_period: 24h
    delete_request_store: s3
  auth_enabled: false

  storage:
    type: s3
    bucketNames:
      chunks: 'loki-uat-selco'
      ruler: 'loki-uat-selco'
#      admin: <Your AWS bucket for admin, for example, `aws-loki-dev-admin`>
    s3:
      # AWS endpoint URL
      endpoint: s3.ap-south-1.amazonaws.com
      # AWS region where the S3 bucket is located
      region: ap-south-1
      # Forces the path style for S3 (true/false)
      s3ForcePathStyle: false
      # Allows insecure (HTTP) connections (true/false)
      insecure: false
      # HTTP configuration settings
      http_config: {}

# Cache configurations with fixed resource limits
resultsCache:
  enabled: true
  replicas: 1
  allocatedMemory: 512  # 512MB allocated memory (down from default 1024MB)
  maxItemMemory: 5     # 5MB max item size
  writebackSizeLimit: 100MB  # Reduced from default 500MB
  resources:
    limits:
      cpu: 200m
      memory: 768Mi      # 1.5x allocatedMemory as recommended
    requests:
      cpu: 100m
      memory: 256Mi

chunksCache:
  enabled: true
  replicas: 1
  allocatedMemory: 1024  # 1GB allocated memory (down from default 8GB)
  maxItemMemory: 5      # 5MB max item size
  writebackSizeLimit: 100MB  # Reduced from default 500MB
  resources:
    limits:
      cpu: 200m
      memory: 1Gi     # 1.5x allocatedMemory as recommended
    requests:
      cpu: 100m
      memory: 256Mi

# Disable minio storage
minio:
  enabled: false

deploymentMode: SingleBinary

singleBinary:
  replicas: 2
  extraArgs:
    - -config.expand-env=true
    - -target=all
  extraEnv:
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-aws
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-aws
          key: AWS_ACCESS_KEY_ID
  persistence:
    storageClass: gp2
    accessModes:
      - ReadWriteOnce
    size: 10Gi

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
{{- /*
Mirrors this cluster's actual elastic user password (from the real {name}-credentials secret,
via the same lookup pattern secret-cert-export.yaml uses for the CA cert) into other namespaces
as "elasticsearch-credentials" — the fixed name core-services already reference via secretKeyRef
(see configmaps chart's secrets.elasticsearch). This avoids hand-copying the plaintext password
into that chart's values and having it drift from what ES was actually deployed with.
*/}}
{{- if .Values.secret.enabled }}
{{ $password := .Values.secret.password }}
{{- range .Values.exportCredentialsToNamespaces }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: elasticsearch-credentials
  namespace: {{ . }}
  labels:
    app: "{{ template "name" $ }}"
    {{- range $key, $value := $.Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
data:
  username: {{ "elastic" | b64enc }}
  password: {{ $password | b64enc }}
{{- end }}
{{- end }}

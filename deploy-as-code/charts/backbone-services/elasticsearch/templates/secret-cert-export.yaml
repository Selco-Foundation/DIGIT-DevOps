{{- /*
Mirrors this cluster's TLS cert secret (the actual CA/cert served by ES, reused as-is via the
lookup in "elasticsearch.gen-certs") into other namespaces, so services running outside
.Values.namespace (e.g. bulk-indexer in core-dev) can mount the same ca.crt to validate ES's
https certificate. Requires .Values.createCert to be true, since that secret is the source of truth.
*/}}
{{- if .Values.createCert }}
{{- range .Values.exportCertToNamespaces }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ template "name" $ }}-certs
  namespace: {{ . }}
  labels:
    app: "{{ template "name" $ }}"
    {{- range $key, $value := $.Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
data:
{{ ( include "elasticsearch.gen-certs" $ ) | indent 2 }}
{{- end }}
{{- end }}

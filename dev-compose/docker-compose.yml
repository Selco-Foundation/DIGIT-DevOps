# Docker Compose rendition of the egovernments/SELCO `core-dev` + `backbone-dev`
# Kubernetes namespaces (EKS cluster new-selco-dev), generated for local/dev-cost
# testing. See README.md for scope, exclusions, and setup instructions.

services:
  # --- one-shot Flyway DB migration jobs (mirrors k8s initContainers) ---
  amc-service-migrate:
    image: selcohub/amc-service-db:amc_configuration_enhancement-0b640fba32d12f609780199e050d498c11e7d0d0
    container_name: amc-service-migrate
    restart: no
    environment:
      DB_URL: "jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}"
      SCHEMA_TABLE: "amc_service_schema"
      FLYWAY_USER: "${DB_USERNAME}"
      FLYWAY_PASSWORD: "${DB_PASSWORD}"
      FLYWAY_LOCATIONS: "filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa,classpath:/db/migration/main"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    networks:
      - selco-network


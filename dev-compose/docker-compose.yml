  # --- core-dev application services ---
  amc-service:
    image: selcohub/amc-service:amc_configuration_enhancement-0b640fba32d12f609780199e050d498c11e7d0d0
    container_name: amc-service
    restart: unless-stopped
    depends_on:
      amc-service-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EGOV_OTP_BYPASS_VALIDATION: "true"
      SERVER_PORT: "8080"
      SERVER_SERVLET_CONTEXT_PATH: "/asset-amc"
      JAVA_OPTS: "-Xmx512m -Xms512m"
      SPRING_REDIS_HOST: "redis"
      KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG: "kafka:9092"
      EGOV_OTP_HOST: "http://egov-otp:8080"
      EGOV_PDF_HOST: "http://pdf-service:8080"
      EGOV_LOCALIZATION_HOST: "http://egov-localization:8080"
      EGOV_IDGEN_HOST: "http://egov-idgen:8080/"
      EGOV_MDMS_HOST: "http://egov-mdms-service:8080/"
      EGOV_PROJECT_HOST: "http://project:8080/"
      EGOV_FACILITY_HOST: "http://facility-service:8080/"
      EGOV_LOCATION_HOST: "http://egov-location:8080/"
      EGOV_BOUNDARY_HOST: "http://boundary-service:8080/"
      EGOV_WORKFLOW_HOST: "http://egov-workflow-v2:8080/"
      EGOV_HRMS_HOST: "http://egov-hrms:8080/"
      EGOV_ENC_HOST: "http://egov-enc-service:8080"
      EGOV_VENDOR_HOST: "http://vendor-registry:8080"
      EGOV_ASSET_HOST: "http://asset-registry:8080/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}"
      FLYWAY_ENABLED: "false"
      SPRING_FLYWAY_ENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: "/"
      APP_TIMEZONE: "Asia/Kolkata"
      FLYWAY_URL: "jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      SPRING_DATASOURCE_TOMCAT_INITIAL_SIZE: "1"
      SERVER_TOMCAT_MAX_THREADS: "10"
      SERVER_TOMCAT_MAX_CONNECTIONS: "500"
      SPRING_DATASOURCE_TOMCAT_MAX_ACTIVE: "2"
      SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_JPA_SHOW_SQL: "true"
      STATE_LEVEL_TENANTID_LENGTH: "1"
      IS_ENVIRONMENT_CENTRAL_INSTANCE: "false"
      STATE_SCHEMA_INDEX_POSITION_TENANTID: "0"
      KAFKA_TOPIC_AUDIT: "enc-user-audit-data"
      OTEL_SERVICE_NAME: "amc-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-tracing-collector:4318/"
    ports:
      - "18000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/asset-amc/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.3'
    networks:
      - selco-network


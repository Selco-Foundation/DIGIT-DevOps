# Single ingress for the selco-compose-devops stack.
#
# Routing model:
#   - /digit-ui/*   -> digit-ui        (SPA frontend)
#   - known API path prefixes (asset-amc, user, egov-mdms-service, ...)
#                   -> gateway          (Spring Cloud Gateway does the final
#                                        hop to each microservice per
#                                        configs/gateway/routes.properties)
#   - /project/*, /egov-user-event/*
#                   -> their own containers directly, because these two are
#                      NOT listed in configs/gateway/routes.properties
#   - dev-tool UIs (kafka-ui, kibana, pgadmin4, jaeger)
#                   -> their own containers
#
# Intended to run as its own container on the `selco-network` docker network
# (service/container names below are resolved via Docker's embedded DNS).
# Mount as /etc/nginx/nginx.conf in the official `nginx` image.

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # egov-filestore accepts uploads up to 1000MB (SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE)
    client_max_body_size 1000m;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # --- upstreams (container_name from docker-compose.yml) ---
    upstream digit_ui         { server digit-ui:80; }
    upstream gateway_upstream { server gateway:8080; }
    upstream project_svc      { server project:8080; }
    upstream egov_user_event  { server egov-user-event:8080; }
    upstream kafka_ui         { server kafka-ui:8080; }
    upstream kibana_ui        { server kibana-kibana:5601; }
    upstream pgadmin_ui       { server pgadmin4:80; }
    upstream jaeger_query     { server jaeger-tracing-query:16686; }

    server {
        listen 80;
        server_name _;

        # common proxy settings, applied per-location below
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # convenience redirect for bare "/"
        location = / {
            return 302 /digit-ui/;
        }

        # --- frontend ---
        location /digit-ui/ {
            proxy_pass http://digit_ui;
        }

        # --- services routed through the API gateway ---
        # (path prefixes mirror configs/gateway/routes.properties)
        location ~ ^/(asset-amc|asset-registry|audit-service|boundary-service|access|egov-enc-service|filestore|egov-hrms|egov-idgen|egov-indexer|localization|egov-location|egov-mdms-service|otp|user|egov-workflow-v2|facility-service|field-planner|activity|im-services-analytics|im-services|inbox|ingestion-service|pdf-service|processor-services|translator|user-otp|vendor)/ {
            proxy_pass http://gateway_upstream;
        }

        # --- services not present in gateway routes.properties ---
        location /project/ {
            proxy_pass http://project_svc;
        }

        location /egov-user-event/ {
            proxy_pass http://egov_user_event;
        }

        # --- dev-tool UIs ---
        location /kafka-ui/ {
            proxy_pass http://kafka_ui;
        }

        location /kibana/ {
            proxy_pass http://kibana_ui;
        }

        location /pgadmin4/ {
            proxy_set_header X-Script-Name /pgadmin4;
            proxy_pass http://pgadmin_ui/;
        }

        location /tracing/ {
            proxy_pass http://jaeger_query;
        }
    }
}

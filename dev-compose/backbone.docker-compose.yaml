services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: elasticsearch
      network.host: "0.0.0.0"
      ES_JAVA_OPTS: "-Xmx1g -Xms1g"
      ELASTIC_PASSWORD: "${ES_PASSWORD}"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.5'
    networks:
      selco-network:
        aliases:
          - elasticsearch-data
          - elasticsearch-master

  kafka:
    image: selcohub/kafka:3.6.0-debian-11-r0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_KRAFT_CLUSTER_ID:-Mk3OEYBSD34fcwNTJENDM2Qk}"
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1'
    networks:
      selco-network:
        aliases:
          - kafka-kraft-controller
          - kafka-kraft-controller-headless
          - kafka-kraft

  redis:
    image: egovio/redis:7.2.4
    container_name: redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
    networks:
      - selco-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: "Kafka"
      SERVER_SERVLET_CONTEXT_PATH: "/kafka-ui"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    ports:
      - "18300:8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    networks:
      - selco-network

  kibana-kibana:
    image: selcohub/kibana-plugin-poc:mark-16
    container_name: kibana-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "elastic"
      ELASTICSEARCH_PASSWORD: "${ES_PASSWORD}"
      SERVER_HOST: "0.0.0.0"
      SERVER_REWRITEBASEPATH: "true"
      SERVER_BASEPATH: "/kibana"
      NODE_OPTIONS: "--max-old-space-size=1800"
    ports:
      - "15601:5601"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    networks:
      - selco-network

  pgadmin4:
    image: dpage/pgadmin4:9.3
    container_name: pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
      SCRIPT_NAME: "/pgadmin4"
    ports:
      - "15050:80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    networks:
      - selco-network

  jaeger-tracing-collector:
    image: jaegertracing/jaeger-collector:1.53.0
    container_name: jaeger-tracing-collector
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      ES_SERVER_URLS: "http://elasticsearch:9200"
      ES_TLS_ENABLED: "false"
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "elasticsearch"
      ES_USE_ROLLOVER: "true"
      ES_ROLLOVER: "true"
      ES_USERNAME: "elastic"
      ES_PASSWORD: "${ES_PASSWORD}"
    ports:
      - "14268:14268"
      - "4318:4318"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    networks:
      - selco-network

  jaeger-tracing-query:
    image: jaegertracing/jaeger-query:1.53.0
    container_name: jaeger-tracing-query
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      ES_SERVER_URLS: "http://elasticsearch:9200"
      ES_TLS_ENABLED: "false"
      SPAN_STORAGE_TYPE: "elasticsearch"
      ES_USERNAME: "elastic"
      ES_PASSWORD: "${ES_PASSWORD}"
      QUERY_BASE_PATH: "/tracing"
      JAEGER_AGENT_PORT: "6831"
    ports:
      - "16686:16686"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    networks:
      - selco-network

networks:
  selco-network:
    driver: bridge

volumes:
  elasticsearch_data:
  kafka_data:
  pgadmin_data:
